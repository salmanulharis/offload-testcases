name: Deploy to Cloudflare Pages

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run schema tests
        run: node --test tests/schema.test.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check required secrets
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_KV_NAMESPACE_ID; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "Missing GitHub secret: $name"
              missing=1
            else
              echo "$name is set (length ${#value})"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Set the secrets in the repository, then re-run this workflow."
            exit 1
          fi
          if ! echo "$CLOUDFLARE_KV_NAMESPACE_ID" | grep -Eq '^[a-fA-F0-9]{32}$'; then
            echo "CLOUDFLARE_KV_NAMESPACE_ID must be the 32-character hex Namespace ID from Workers KV, not the namespace title."
            echo "Length received: ${#CLOUDFLARE_KV_NAMESPACE_ID}"
            exit 1
          fi

      - name: Bind KV namespace for production
        run: |
          cat >> wrangler.toml << EOF

          [[kv_namespaces]]
          binding = "TEST_RESULTS"
          id = "${CLOUDFLARE_KV_NAMESPACE_ID}"
          EOF
          echo "KV binding TEST_RESULTS appended to wrangler.toml"

      - name: Install Wrangler 4
        run: npm install --global wrangler@4

      - name: Check Cloudflare auth
        run: wrangler whoami

      - name: Ensure Pages project exists
        run: |
          wrangler pages project create offload-testcases --production-branch=main \
            || echo "Project create skipped (it may already exist). Deploy will show the real error if not."

      - name: Deploy to Cloudflare Pages
        run: |
          wrangler pages deploy public \
            --project-name=offload-testcases \
            --branch=main \
            --commit-dirty=true \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="${GITHUB_REF_NAME}"
